<header><h1>消費者行為｜隨機測驗</h1><p>依據期中考試參考資料整理・作答後自動計分</p></header>
<main>

<div class="controls">

<div class="field"><label class="small" for="mode">作答方式</label><select id="mode"><option value="end" selected>全部作答後一次批改</option><option value="instant">每題作答後立即顯示答案</option></select></div>
</div>
<div class="actions"><button id="start">開始隨機測驗</button></div>
<p class="muted">計分方式：每題依本次題數平均換算為 100 分；50 題模式每題 2 分。</p>
 <p class="muted">版本修正20261108_2218</p>
</section>
<section id="quiz" class="hidden">
<div class="panel"><div class="status"><span id="progressText">第 1 題</span><span id="answeredText">已作答 0 題</span></div><div class="bar"><i id="progressBar"></i></div></div>
<div id="questions"></div>
<div class="panel"><div class="actions"><button class="secondary" id="prev">上一題</button><button class="secondary" id="next">下一題</button><button id="submit">交卷並計分</button></div></div>
</section>
<section id="result" class="hidden"></section>
</main>
<footer>題目與答案依上傳 PDF 中紅色標示整理；原始題號可能重複或不連續。</footer>

%集中於哪一種感官？", "options": {"A": "聽覺", "B": "嗅覺", "C": "視覺", "D": "觸覺"}, "answer": "C"}, {"number": "65", "prompt": "某家咖啡廳播放著非常微弱的背景音樂，小明必須把耳朵湊過去、極度專 注才能勉強聽到一絲聲音。這個「剛剛好能被耳朵察覺」的最低聲音強度，在 心理學上稱之為什麼？", "options": {"A": "差異門檻", "B": "絕對門檻", "C": "知覺警覺", "D": "品牌偏好"}, "answer": "B"}, {"number": "66", "prompt": "根據韋伯定律（Weber's Law），商品價格越高，要讓消費者察覺價格變化， 應如何調整？根據韋伯定律，一杯 $50 元的手搖飲降價 5 元，客人就會覺得 便宜；但如果是一台 $5,000 的空氣清淨機，要讓消費者明顯察覺到有降價，降 價幅度應該如何調整？", "options": {"A": "只要降價 5 元客人就會很有感", "B": "降價幅度完全不用改變", "C": "降價金額需 要相對放大非常多（例如：降 500 元）", "D": "直接換個新包裝即可"}, "answer": "C"}, {"number": "67", "prompt": "消費者因為正在找工作，而開始特別注意西裝及正式服裝，此現象稱為：", "options": {"A": "知覺防衛性", "B": "知覺警覺性", "C": "知覺適應性", "D": "感官門檻"}, "answer": "B"}, {"number": "68", "prompt": "消費者刻意忽略自己不喜歡品牌的資訊，屬於：", "options": {"A": "知覺警覺性", "B": "知覺適應性", "C": "知覺防衛性", "D": "差異門檻"}, "answer": "C"}, {"number": "69", "prompt": "人們看到招牌缺了一個字，仍能辨識完整店名，是完形心理學中的哪一項 原則？", "options": {"A": "相似律", "B": "閉合律", "C": "主題背景律", "D": "韋伯定律"}, "answer": "B"}, {"number": "70", "prompt": "小明看到同事買了某款行動電源，大讚充電速度極快又安全，於是小明默 默記下來，決定下個月發薪水也去買一顆。小明這種透過看別人的經驗來學習 的行為屬於：", "options": {"A": "古典制約", "B": "操作制約", "C": "觀察性學習", "D": "偶發性學習"}, "answer": "C"}, {"number": "71", "prompt": "下列何者最符合古典制約的概念？", "options": {"A": "消費者因購物得到贈品而持續購買", "B": "將自然引發愉悅感的刺激與品牌反 覆配對，使其與品牌產生聯結", "C": "消費者透過閱讀說明書學習產品使用方式", "D": "消費者比較產品功能後做出購買決策"}, "answer": "B"}, {"number": "72", "prompt": "消費者對下述哪一種感官感覺的控制性最小？", "options": {"A": "視覺", "B": "聽覺", "C": "嗅覺", "D": "味覺"}, "answer": "C"}, {"number": "73", "prompt": "小張喜歡到處品嚐不同店家的牛肉麵，並與過去經驗進行比較，此屬哪一 種知覺歷程？", "options": {"A": "感官感覺", "B": "刺激接觸", "C": "刺激組織", "D": "刺激解釋"}, "answer": "C"}, {"number": "74", "prompt": "馬路上的小黃（計程車）容易引起消費者注意，此乃哪一種知覺歷程？", "options": {"A": "刺激選擇", "B": "刺激接觸", "C": "刺激組織", "D": "刺激解釋"}, "answer": "B"}, {"number": "75", "prompt": "小吳想要購屋，對於路上的房屋廣告看板特別注意，此乃何種知覺特性？", "options": {"A": "知覺警覺性", "B": "知覺防衛性", "C": "知覺適應性", "D": "知覺敏感性"}, "answer": "A"}, {"number": "76", "prompt": "產品延伸主要運用完形心理學中的哪一項原理？", "options": {"A": "閉合律", "B": "相似律", "C": "對比律", "D": "主題背景律"}, "answer": "B"}, {"number": "77", "prompt": "網路動態橫幅廣告比靜態廣告更易吸引消費者注意，主要因為＿＿＿知覺 原理？", "options": {"A": "頻率", "B": "顏色", "C": "位置", "D": "移動"}, "answer": "D"}, {"number": "79", "prompt": "就制約刺激和非制約刺激的關係而言，以下何者不是古典制約的成功條 件？", "options": {"A": "誘因配對", "B": "重複配對", "C": "固定配對", "D": "成對出現"}, "answer": "A"}, {"number": "80", "prompt": "銀行獎勵消費者每個月刷卡五筆、每筆599 元以上，即可獲得贈品，此乃 運用哪一種學習原理？", "options": {"A": "定期強化", "B": "不定期強化", "C": "形塑制約", "D": "刺激類化"}, "answer": "C"}, {"number": "81", "prompt": "「及早購買、以免向隅」運用哪一種操作制約原理？", "options": {"A": "正面強化", "B": "反面強化", "C": "形塑制約", "D": "懲罰"}, "answer": "B"}, {"number": "82", "prompt": "五感之中，人類感受最深的依序分別為 甲.觸覺 乙.聽覺 丙.嗅覺 丁.視覺 戊.味覺", "options": {"A": "乙丙戊丁甲", "B": "甲丙戊丁乙", "C": "丁丙乙戊甲", "D": "丙丁戊乙甲"}, "answer": "C"}, {"number": "83", "prompt": "店門口掛的大紅色布條，通常用來告知消費者促銷或優惠消息，此是透過 刺激消費者的何種感官來吸引消費者入內消費?", "options": {"A": "視覺", "B": "觸覺", "C": "聽覺", "D": "味覺"}, "answer": "A"}, {"number": "84", "prompt": "牙膏和漱口水推出草莓、青蘋果等口味，主要是希望能滿足顧客族群兒童 的何種感官需求?", "options": {"A": "嗅覺", "B": "味覺", "C": "視覺", "D": "觸覺"}, "answer": "B"}, {"number": "85", "prompt": "舒潔強調它們永遠會是顧客最溫柔的夥伴，主要是透過提升消費者何種感 官需求來作為他們的定位?", "options": {"A": "聽覺", "B": "視覺", "C": "嗅覺", "D": "觸覺"}, "answer": "D"}, {"number": "86", "prompt": "使用五官接收來自外界的刺激，並產生感官感覺，接著我們選擇、組織、 解釋這些感覺，這個過程稱為", "options": {"A": "視覺", "B": "嗅覺", "C": "知覺", "D": "觸感"}, "answer": "C"}, {"number": "87", "prompt": "消費者知覺過程包含三階段，最先接觸刺激的是", "options": {"A": "展露階段", "B": "注意階段", "C": "理解階段", "D": "以上皆是"}, "answer": "A"}, {"number": "88", "prompt": "消費者知覺過程中，哪一階段主要的知覺任務是組織與解釋上個階段選擇 的刺激?", "options": {"A": "注意階段", "B": "理解階段", "C": "展露階段", "D": "以上皆是"}, "answer": "B"}, {"number": "89", "prompt": "能夠帶來感官反應的刺激強度，稱為", "options": {"A": "選擇性展露", "B": "感官門檻", "C": "感官反應", "D": "刺激接觸"}, "answer": "B"}, {"number": "90", "prompt": "能夠產生感官反應的最低刺激強度，稱為", "options": {"A": "感官門檻", "B": "差異門檻", "C": "刺激接觸", "D": "絕對門檻"}, "answer": "D"}, {"number": "91", "prompt": "專為銀髮族設計的手機，是考慮到了銀髮族在視覺上的", "o 銷可口可樂", "C": "嚴謹的學術研究已證實「閾下意識」的存 在", "D": "曾有大賣場用此原理，將防竊訊息相嵌在音樂裡"}, "answer": "C"}, {"number": "142", "prompt": "在消費過程中「覺察到的個人重要性或利益關連」與訊息處理的哪一部份 有關？", "options": {"A": "絕對閾限", "B": "次意識知覺", "C": "差異 閾限", "D": "調適作用"}, "answer": "B"}, {"number": "144", "prompt": "jnd 的概念和以下何者有關？", "options": {"A": "絕對閾限", "B": "次意識知覺", "C": "差異閾限", "D": "調適作用"}, "answer": "C"}, {"number": "145", "prompt": "「消費者的注意力受到某外部刺激的吸引」屬於何種歷程？", "options": {"A": "自發性", "B": "非自發性", "C": "自發與非自發都有可能", "D": "兩者都不可能"}, "answer": "B"}, {"number": "146", "prompt": "以下何者不真？", "options": {"A": "「認知吝嗇」對訊息處理並無幫助", "B": "「前注意期」旨 在評估該訊息是否值得注意", "C": "注意期在個人的意識覺察範圍", "D": "前注意期則 是個人意識所沒覺察到的"}, "answer": "A"}, {"number": "147", "prompt": "永備電池的電視廣告以兔子敲鼓為主軸，看誰家的電池兔子敲得最久，它 有十種左右的故事版本。為何要準備這麼多版本的廣告？", "options": {"A": "避免產生調適現 象", "B": "運用正增強原理", "C": "Zeigarnik 效應", "D": "運用重複學習效果"}, "answer": "A"}, {"number": "148", "prompt": "有一天你注意到某款小型車的廣告，正好最近想換車了，詢問之後，才知 道那則廣告已經播放好一段時間了。以下何者與這個現象無關？", "options": {"A": "你最近升 高汽車產品的心理涉入", "B": "選擇性地注意到與汽車有關的廣告", "C": "Zeigarnik 效 應", "D": "你主動搜尋與自己有關的訊息"}, "answer": "C"}, {"number": "149", "prompt": "Pavlov 的實驗裡的「條件刺激CS」為", "options": {"A": "鈴聲", "B": "電擊", "C": "經由餵食管流 入狗嘴的食物", "D": "狗視線所及之範圍內的食物"}, "answer": "A"}, {"number": "150", "prompt": "針對「某固定時段後出現的第一次的行為反應給予增強作用」之排程稱之 為", "options": {"A": "固定比率", "B": "固定時距", "C": "變動比率", "D": "變動時距"}, "answer": "B"}, {"number": "151", "prompt": "若「每出現15 次正確的行為反應即給予一次增強作用」，此排程稱之為", "options": {"A": "固定比率", "B": "固定時距", "C": "變動比率", "D": "變動時距"}, "answer": "A"}, {"number": "162", "prompt": "Pavlov 的實驗裡，食物是﹍﹍﹍，燈光或鈴聲是﹍﹍﹍", "options": {"A": "UCS，CS", "B": "CS，UCS", "C": "UCS，CR", "D": "UCR，CR"}, "answer": "A"}, {"number": "153", "prompt": "部分增強排程", "options": {"A": "強化效果不如連續增強排程", "B": "學習曲線較連續增強 上升得更快", "C": "消除曲線掉得更快", "D": "在實務的應用上優於連續增強"}, "answer": "D"}, {"number": "154", "prompt": "以下的敘述何者不真？", "options": {"A": "古典制約裡，無條件刺激可以強化條件刺激", "B": "操作制約裡，行為的後果可以強化行為反應", "C": "操作制約的學習機制在於行為 與環境刺激的關係R-S", "D": "古典制約裡行為反應的機率取決於或依附行為的後果"}, "answer": "D"}, {"number": "155", "prompt": "統一比康師傅晚進入大陸，統一方便麵的市佔率老是落後，想藉著北京奧 運會方便麵獨家贊助商，獲得形象加持。從古典制約的角度分析，統一方便麵 是", "options": {"A": "UCS", "B": "CS", "C": "UCR", "D": "CR"}, "answer": "B"}, {"number": "160", "prompt": "統一比康師傅晚進入大陸，統一方便麵的市佔率老是落後，想藉著北京奧 運會方便麵獨家贊助商，獲得形象加持。從古典制約的角度分析，奧運會是", "options": {"A": "UCS", "B": "CS", "C": "UCR", "D": "CR"}, "answer": "A"}, {"number": "161", "prompt": "汽車經銷商把顧客的購買切割成幾個步驟：進入展示間、試乘車子、詢問 產品及價格、購買、回廠保養、再購買。首要步驟是讓顧客進到展示間，然後 再強化後續的行為。這個過程運用了何種原理？", "options": {"A": "消除", "B": "行為塑造", "C": "負 增強", "D": "代理學習"}, "answer": "B"}, {"number": "162", "prompt": "以下何者不應成為「觀察學習」裡的楷模特質", "options": {"A": "值得信賴", "B": "與學習者 的背景愈不相同愈佳", "C": "像個成功者", "D": "具外貌吸引力."}, "answer": "B"}];
document.getElementById('totalCount').textContent = BANK.length;
let quiz=[],answers={},current=0,mode='end',graded=false;
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){
 const n=$('count').value==='all'?BANK.length:Number($('count').value);
 quiz=shuffle(BANK).slice(0,n).map(q=>({...q,choices:shuffle(Object.entries(q.options).map(([key,text])=>({key,text})))}));
 answers={};current=0;graded=false;mode=$('mode').value;
 $('setup').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');
 render();
}
function render(){
 const q=quiz[current],selected=answers[current];
 $('progressText').textContent=`第 ${current+1} / ${quiz.length} 題`;
 $('answeredText').textContent=`已作答 ${Object.keys(answers).length} 題`;
 $('progressBar').style.width=`${(current+1)/quiz.length*100}%`;
 $('questions').innerHTML='';
 const card=document.createElement('article');card.className='question';
 const title=document.createElement('p');title.className='qtitle';title.textContent=`${current+1}. ${q.prompt}`;card.appendChild(title);
 q.choices.forEach(choice=>{
   const lab=document.createElement('label');lab.className='option';
   const inp=document.createElement('input');inp.type='radio';inp.name='answer';inp.value=choice.key;inp.checked=selected===choice.key;inp.disabled=graded||(mode==='instant'&&selected!==undefined);
   inp.addEventListener('change',()=>{answers[current]=choice.key;if(mode==='instant'){showInstant(card,q,choice.key)}renderStatus()});
   const span=document.createElement('span');span.textContent=choice.text;
   lab.append(inp,span);card.appendChild(lab);
 });
 if(mode==='instant'&&selected!==undefined)showInstant(card,q,selected);
 $('questions').appendChild(card);
 $('prev').disabled=current===0;$('next').disabled=current===quiz.length-1;
 $('submit').textContent=graded?'查看結果':'交卷並計分';
}
function showInstant(card,q,key){
 let f=card.querySelector('.feedback');if(!f){f=document.createElement('div');f.className='feedback';card.appendChild(f)}
 f.innerHTML=key===q.answer?'<span class="correct">答對了！</span>':'<span class="incorrect">答錯了。</span> 正確答案：'+q.answer+'．'+q.options[q.answer];
}
function renderStatus(){$('answeredText').textContent=`已作答 ${Object.keys(answers).length} 題`}
function grade(){
 if(graded){showResult();return}
 const unanswered=quiz.length-Object.keys(answers).length;
 if(unanswered>0&&!confirm(`還有 ${unanswered} 題未作答，確定交卷？`))return;
 graded=true;showResult();
}
function showResult(){
 let correct=0;quiz.forEach((q,i)=>{if(answers[i]===q.answer)correct++});
 const score=Math.round(correct/quiz.length*1000)/10;
 const wrong=quiz.map((q,i)=>({...q,user:answers[i],idx:i})).filter(q=>q.user!==q.answer);
 $('quiz').classList.add('hidden');$('result').classList.remove('hidden');
 $('result').innerHTML=`<div class="result"><h2 style="margin-top:0">測驗結果</h2><div class="score">${score} 分</div><p>答對 <b>${correct}</b> 題　答錯 <b>${wrong.length}</b> 題　未作答 <b>${quiz.length-Object.keys(answers).length}</b> 題</p><div class="bar"><i style="width:${score}%"></i></div><p class="muted">答對率 ${score}%</p><div class="actions"><button id="retryWrong" ${wrong.length?'':'disabled'}>只練習錯題（${wrong.length} 題）</button><button class="secondary" id="again">重新隨機測驗</button></div></div><div class="result"><h3 style="margin-top:0">錯題檢討</h3>${wrong.length?wrong.map(q=>`<div class="review-item"><p><b>原題號 ${q.number}｜${q.prompt}</b></p><p class="incorrect">你的答案：${q.user? q.user+'．'+q.options[q.user]:'未作答'}</p><p class="correct">正確答案：${q.answer}．${q.options[q.answer]}</p></div>`).join(''):'<p class="correct">太好了！本次全部答對。</p>'}</div>`;
 $('retryWrong').addEventListener('click',()=>{const subset=wrong.map(({user,idx,...q})=>q);quiz=shuffle(subset).map(q=>({...q,choices:shuffle(Object.entries(q.options).map(([key,text])=>({key,text})))}));answers={};current=0;graded=false;$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()});
 $('again').addEventListener('click',()=>{ $('result').classList.add('hidden');$('setup').classList.remove('hidden')});
}
$('start').addEventListener('click',start);
$('prev').addEventListener('click',()=>{if(current>0){current--;render()}});
$('next').addEventListener('click',()=>{if(current<quiz.length-1){current++;render()}});
$('submit').addEventListener('click',grade);
</script>
</body></html>
